<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20252e"/><stop offset=".7" stop-color="#2d323b"/><stop offset="1" stop-color="#3a3e47"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3c4049"/><stop offset=".5" stop-color="#2d3139"/><stop offset="1" stop-color="#22252c"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d838d"/><stop offset="1" stop-color="#454a53"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a3427"/><stop offset="1" stop-color="#53201a"/></linearGradient>
  <radialGradient id="spot" cx="50%" cy="38%" r="55%"><stop offset="0" stop-color="#aab4c6" stop-opacity=".22"/><stop offset="1" stop-color="#aab4c6" stop-opacity="0"/></radialGradient>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
  <pattern id="peg" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.1" fill="#000" fill-opacity=".45"/></pattern>
  <filter id="dof" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.9"/></filter>
  <filter id="dof2" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3.4"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer></filter>
</defs>
<!-- duvar: koyu, mat, fotoğraf stüdyosuyla aynı soğuk gri-mavi -->
<rect width="400" height="260" fill="url(#wall)"/>
<g opacity=".5" stroke="#000" stroke-opacity=".35"><path d="M0 34H400M0 78H400"/></g>
<!-- derinlik bulanıklığı: arka plan nesneleri odak dışı -->
<g filter="url(#dof)">
  <!-- sol: alet panosu -->
  <rect x="2" y="12" width="98" height="100" rx="3" fill="#2a3340"/><rect x="2" y="12" width="98" height="100" rx="3" fill="url(#peg)"/>
  <g stroke="#9aa1ab" stroke-width="3.2" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M14 24v38"/><circle cx="14" cy="21" r="5.5"/><path d="M28 24v34M24 58h8"/><path d="M42 24v42M38 66h8"/><path d="M56 22h10M60 22v44"/><circle cx="60" cy="70" r="4"/>
    <path d="M12 88h78"/><circle cx="20" cy="97" r="4.5"/><circle cx="36" cy="97" r="4.5"/><circle cx="52" cy="97" r="4.5"/>
  </g>
  <g opacity=".8"><rect x="74" y="24" width="9" height="34" rx="2" fill="#a2561f"/><rect x="87" y="28" width="8" height="28" rx="2" fill="#a2561f"/><rect x="74" y="58" width="9" height="14" rx="1.5" fill="#aeb4bd"/><rect x="87" y="56" width="8" height="12" rx="1.5" fill="#aeb4bd"/></g>
  <!-- sağ: raf, bidonlar, kask -->
  <rect x="316" y="72" width="84" height="5" rx="1.5" fill="url(#steel)"/>
  <rect x="324" y="46" width="15" height="26" rx="2" fill="#8d4a1c"/><rect x="344" y="50" width="13" height="22" rx="2" fill="#37566f"/><rect x="362" y="54" width="11" height="18" rx="2" fill="#7a3a22"/>
  <path d="M378 72c-1-12 3-20 11-20s9 8 9 20z" fill="#b9bfc7"/><path d="M380 64h16l2 4h-18z" fill="#242a33"/>
  <rect x="316" y="114" width="84" height="4" fill="url(#steel)"/>
  <rect x="324" y="96" width="30" height="18" rx="2" fill="#7a3a22"/><rect x="330" y="91" width="18" height="6" rx="1" fill="#4a2414"/><rect x="360" y="100" width="22" height="14" rx="2" fill="#3a414b"/>
  <!-- sarkan lamba -->
  <path d="M200 0v12" stroke="#14181e" stroke-width="2"/><path d="M186 24c0-8 6-12 14-12s14 4 14 12z" fill="#4a515c"/><ellipse cx="200" cy="25" rx="14" ry="2.4" fill="#e9eef7"/>
</g>
<!-- zemin: parlak koyu karo, fotoğrafın zemini ile aynı ton -->
<rect y="118" width="400" height="142" fill="url(#floor)"/><path d="M0 118h400" stroke="#000" stroke-opacity=".35" stroke-width="1.5"/>
<g stroke="#000" stroke-opacity=".28" stroke-width="1"><path d="M0 150H400M0 192H400M0 244H400"/><path d="M200 118V260M120 118L40 260M280 118L360 260M20 118L-90 260M380 118L490 260"/></g>
<!-- zemindeki nesneler (daha da odak dışı) -->
<g filter="url(#dof2)">
  <rect x="4" y="138" width="80" height="62" rx="3" fill="url(#red)"/><rect x="4" y="132" width="80" height="9" rx="2" fill="#3a414b"/>
  <g fill="#6b2a20" stroke="#2c100c" stroke-width="1.4"><rect x="9" y="145" width="70" height="12" rx="1.5"/><rect x="9" y="160" width="70" height="12" rx="1.5"/><rect x="9" y="175" width="70" height="12" rx="1.5"/></g>
  <g stroke="#bcc3cb" stroke-width="2.2" stroke-linecap="round" opacity=".7"><path d="M34 151h22M34 166h22M34 181h22"/></g>
  <ellipse cx="354" cy="196" rx="32" ry="9" fill="#0d1014"/><rect x="322" y="180" width="64" height="16" fill="#14181d"/><ellipse cx="354" cy="180" rx="32" ry="9" fill="#242a31"/><ellipse cx="354" cy="180" rx="15" ry="4" fill="#0a0c0f"/>
  <rect x="322" y="164" width="64" height="16" fill="#1a1f25"/><ellipse cx="354" cy="164" rx="32" ry="9" fill="#2d343c"/><ellipse cx="354" cy="164" rx="15" ry="4" fill="#0a0c0f"/>
</g>
<!-- yumuşak spot ışığı + zemin yansıması + kenar kararması + film greni -->
<rect width="400" height="260" fill="url(#spot)"/>
<rect y="118" width="400" height="142" fill="#fff" opacity=".035"/>
<rect width="400" height="260" fill="url(#vig)"/>
<rect width="400" height="260" filter="url(#grain)"/>
</svg>
